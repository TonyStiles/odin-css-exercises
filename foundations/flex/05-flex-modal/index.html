<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Modal</title>
  </head>
  <body>
    <div class="modal">
      <div class="modal-box">
        <div class="modal-icon">!</div>
        <div class="modal-body">
          <div class="modal-header">
            <div class="modal-title">Are you sure you want to do that?</div>
            <button class="modal-close">✖</button>
          </div>
          <div class="modal-message">Lorem ipsum dolor sit amet consectetur adipisicing elit. Pariatur excepturi id soluta, numquam minima rerum doloremque eveniet aspernatur beatae commodi. Cupiditate recusandae ad repellendus quidem consectetur sequi amet aspernatur cumque!</div>
          <div class="modal-actions">
            <button class="btn-continue">Continue</button>
            <button class="btn-cancel">Cancel</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
